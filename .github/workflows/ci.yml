name: CI_Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest #runner

    steps:
      - uses: action/checkout@v4

      - name: Checkout code
        run: |
          echo "This is my first build"
          uname -a

      - name: Check Docker Installation
        run: |
          docker info
          
      - name: Run Docker container
        run : |
          docker run hello-world

      - name: Check Docker images
        run: |
          docker images
          docker ps
          
